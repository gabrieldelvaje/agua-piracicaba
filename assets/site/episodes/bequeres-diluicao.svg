<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Comparação conceitual de diluição</title>
  <desc id="desc">Dois béqueres com a mesma quantidade de partículas. O primeiro tem mais água e maior diluição; o segundo tem menos água e maior concentração.</desc>
  <rect width="800" height="560" fill="none"/>
  <defs>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".48"/>
      <stop offset=".28" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Béquer 1 -->
  <path d="M92 82 L105 89 L105 342 Q105 373 136 373 L304 373 Q335 373 335 342 L335 89 L348 82"
        fill="rgba(255,255,255,.25)" stroke="#3f403d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M111 160 L329 160 L329 340 Q329 367 302 367 L138 367 Q111 367 111 340 Z"
        fill="#2147e0"/>
  <path d="M111 160 L329 160 L329 340 Q329 367 302 367 L138 367 Q111 367 111 340 Z"
        fill="#79502f" opacity=".10"/>
  <line x1="111" y1="160" x2="329" y2="160" stroke="#fff" stroke-opacity=".66" stroke-width="2"/>
  <rect x="118" y="103" width="13" height="245" rx="6.5" fill="url(#shine)"/>
  <g stroke="#3f403d" stroke-width="2" opacity=".78">
    <line x1="105" y1="125" x2="128" y2="125"/><line x1="105" y1="150" x2="119" y2="150"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity=".76">
    <line x1="105" y1="175" x2="128" y2="175"/><line x1="105" y1="200" x2="119" y2="200"/>
    <line x1="105" y1="225" x2="128" y2="225"/><line x1="105" y1="250" x2="119" y2="250"/>
    <line x1="105" y1="275" x2="128" y2="275"/><line x1="105" y1="300" x2="119" y2="300"/>
    <line x1="105" y1="325" x2="128" y2="325"/>
  </g>

  <!-- Partículas: mesma carga -->
  <g fill="#6b4423" opacity=".72">
    <circle cx="143" cy="192" r="4"/><circle cx="198" cy="219" r="4.5"/><circle cx="262" cy="187" r="3.5"/>
    <circle cx="299" cy="226" r="5"/><circle cx="167" cy="257" r="3.5"/><circle cx="228" cy="273" r="4"/>
    <circle cx="288" cy="289" r="3.5"/><circle cx="139" cy="318" r="4.5"/><circle cx="190" cy="337" r="3"/>
    <circle cx="245" cy="323" r="4.5"/><circle cx="312" cy="341" r="3"/><circle cx="157" cy="226" r="3"/>
    <circle cx="273" cy="246" r="3"/><circle cx="211" cy="184" r="4"/><circle cx="303" cy="176" r="3.5"/>
    <circle cx="251" cy="351" r="3.5"/>
  </g>

  <!-- Béquer 2 -->
  <path d="M452 82 L465 89 L465 342 Q465 373 496 373 L664 373 Q695 373 695 342 L695 89 L708 82"
        fill="rgba(255,255,255,.25)" stroke="#3f403d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M471 282 L689 282 L689 340 Q689 367 662 367 L498 367 Q471 367 471 340 Z"
        fill="#2147e0"/>
  <path d="M471 282 L689 282 L689 340 Q689 367 662 367 L498 367 Q471 367 471 340 Z"
        fill="#79502f" opacity=".38"/>
  <line x1="471" y1="282" x2="689" y2="282" stroke="#fff" stroke-opacity=".66" stroke-width="2"/>
  <rect x="478" y="103" width="13" height="245" rx="6.5" fill="url(#shine)"/>
  <g stroke="#3f403d" stroke-width="2" opacity=".78">
    <line x1="465" y1="125" x2="488" y2="125"/><line x1="465" y1="150" x2="479" y2="150"/>
    <line x1="465" y1="175" x2="488" y2="175"/><line x1="465" y1="200" x2="479" y2="200"/>
    <line x1="465" y1="225" x2="488" y2="225"/><line x1="465" y1="250" x2="479" y2="250"/>
    <line x1="465" y1="275" x2="488" y2="275"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity=".76">
    <line x1="465" y1="300" x2="479" y2="300"/><line x1="465" y1="325" x2="488" y2="325"/>
  </g>
  <g fill="#6b4423" opacity=".95">
    <circle cx="498" cy="305" r="4"/><circle cx="523" cy="330" r="4.5"/><circle cx="548" cy="302" r="3.5"/>
    <circle cx="577" cy="340" r="5"/><circle cx="603" cy="313" r="3.5"/><circle cx="628" cy="344" r="4"/>
    <circle cx="657" cy="307" r="3.5"/><circle cx="680" cy="335" r="4.5"/><circle cx="511" cy="350" r="3"/>
    <circle cx="558" cy="353" r="4.5"/><circle cx="614" cy="298" r="3"/><circle cx="645" cy="327" r="3"/>
    <circle cx="532" cy="312" r="3"/><circle cx="589" cy="324" r="4"/><circle cx="668" cy="352" r="3.5"/>
    <circle cx="571" cy="296" r="3.5"/>
  </g>

  <!-- Rótulos -->
  <text x="105" y="423" font-size="27" font-weight="700" fill="#171717">Mais água</text>
  <text x="105" y="454" font-size="17" fill="#565754">Mesma carga → maior diluição</text>
  <text x="465" y="423" font-size="27" font-weight="700" fill="#171717">Menos água</text>
  <text x="465" y="454" font-size="17" fill="#565754">Mesma carga → maior concentração</text>

  <!-- Legenda da carga -->
  <circle cx="108" cy="505" r="5" fill="#6b4423"/>
  <text x="122" y="510" font-size="14" fill="#565754">Mesma quantidade de partículas nos dois béqueres</text>
</svg>